<svg viewBox="0 0 580 190" width="100%" height="190" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="190" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="290" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">SQL DDL: CLONE TABLE STRUCTURE &amp; DATA</text>

  <!-- Source Table -->
  <g transform="translate(30, 45)">
    <rect width="180" height="95" rx="5" fill="#1e293b" stroke="#38bdf8"/>
    <rect width="180" height="24" rx="5" fill="#0284c7"/>
    <text x="90" y="16" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Source: Employees</text>
    <text x="12" y="42" fill="#cbd5e1" font-family="monospace" font-size="9">emp_id INT (PK)</text>
    <text x="12" y="60" fill="#cbd5e1" font-family="monospace" font-size="9">name VARCHAR(50)</text>
    <text x="12" y="78" fill="#cbd5e1" font-family="monospace" font-size="9">salary DECIMAL(10,2)</text>
  </g>

  <!-- Arrow & SQL Command -->
  <g transform="translate(225, 75)">
    <line x1="0" y1="20" x2="110" y2="20" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,2"/>
    <polygon points="110,20 100,15 100,25" fill="#10b981"/>
    <text x="55" y="10" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">AS SELECT *</text>
  </g>

  <!-- Target Table -->
  <g transform="translate(365, 45)">
    <rect width="180" height="95" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="180" height="24" rx="5" fill="#059669"/>
    <text x="90" y="16" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cloned: Emp_Backup</text>
    <text x="12" y="42" fill="#a7f3d0" font-family="monospace" font-size="9">emp_id INT (Data)</text>
    <text x="12" y="60" fill="#a7f3d0" font-family="monospace" font-size="9">name VARCHAR(50)</text>
    <text x="12" y="78" fill="#a7f3d0" font-family="monospace" font-size="9">salary DECIMAL(10,2)</text>
  </g>

  <text x="290" y="165" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">CREATE TABLE Emp_Backup AS SELECT * FROM Employees;</text>
</svg>