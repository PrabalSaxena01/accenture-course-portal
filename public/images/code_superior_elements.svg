<svg viewBox="0 0 560 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="280" y="24" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">ALGORITHM: SUPERIOR ARRAY ELEMENTS (LEADERS SCAN)</text>
  
  <g transform="translate(40, 50)">
    <!-- Array Boxes: [7, 9, 5, 2, 8, 3] -> Leaders are 3, 8, 9 -->
    <rect x="0" y="0" width="70" height="45" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="35" y="28" fill="#94a3b8" font-size="16" font-family="monospace" text-anchor="middle">7</text>

    <rect x="80" y="0" width="70" height="45" fill="#3b0764" stroke="#c084fc" stroke-width="2" rx="4"/>
    <text x="115" y="28" fill="#e879f9" font-size="16" font-weight="bold" font-family="monospace" text-anchor="middle">9 ★</text>

    <rect x="160" y="0" width="70" height="45" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="195" y="28" fill="#94a3b8" font-size="16" font-family="monospace" text-anchor="middle">5</text>

    <rect x="240" y="0" width="70" height="45" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="275" y="28" fill="#94a3b8" font-size="16" font-family="monospace" text-anchor="middle">2</text>

    <rect x="320" y="0" width="70" height="45" fill="#3b0764" stroke="#c084fc" stroke-width="2" rx="4"/>
    <text x="355" y="28" fill="#e879f9" font-size="16" font-weight="bold" font-family="monospace" text-anchor="middle">8 ★</text>

    <rect x="400" y="0" width="70" height="45" fill="#3b0764" stroke="#c084fc" stroke-width="2" rx="4"/>
    <text x="435" y="28" fill="#e879f9" font-size="16" font-weight="bold" font-family="monospace" text-anchor="middle">3 ★</text>
  </g>

  <!-- Right-to-Left Traversal Arrow -->
  <g transform="translate(140, 120)">
    <line x1="280" y1="10" x2="30" y2="10" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="30,10 40,6 40,14" fill="#f43f5e"/>
    <text x="155" y="26" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle">Scan Right-to-Left: Track Running Max O(N)</text>
  </g>
</svg>