<svg viewBox="0 0 540 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="160" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
  <text x="270" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">REGEX VALIDATION: ^[a-zA-Z0-9]{6}$</text>
  <g transform="translate(40, 48)">
    <rect width="210" height="75" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="105" y="26" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">"arun32"  ✅</text>
    <text x="105" y="50" fill="#cbd5e1" font-size="9" text-anchor="middle">Length = exactly 6</text>
    <text x="105" y="65" fill="#cbd5e1" font-size="9" text-anchor="middle">Only letters &amp; numbers</text>
  </g>
  <g transform="translate(290, 48)">
    <rect width="210" height="75" rx="5" fill="#881337" stroke="#f43f5e"/>
    <text x="105" y="26" fill="#fca5a5" font-family="monospace" font-size="12" text-anchor="middle">"arun@32" ❌</text>
    <text x="105" y="50" fill="#fca5a5" font-size="9" text-anchor="middle">Contains '@' symbol (Rejected)</text>
    <text x="105" y="65" fill="#fca5a5" font-size="9" text-anchor="middle">Length != 6 (Rejected)</text>
  </g>
</svg>