<svg viewBox="0 0 540 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="180" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
  <text x="270" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">OSI 7-LAYER REFERENCE MODEL: LAYER 4 TRANSPORT</text>
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="140" height="16" rx="2" fill="#1e293b"/><text x="70" y="12" fill="#64748b" font-size="8" text-anchor="middle">7. Application</text>
    <rect x="0" y="18" width="140" height="16" rx="2" fill="#1e293b"/><text x="70" y="30" fill="#64748b" font-size="8" text-anchor="middle">6. Presentation</text>
    <rect x="0" y="36" width="140" height="16" rx="2" fill="#1e293b"/><text x="70" y="48" fill="#64748b" font-size="8" text-anchor="middle">5. Session</text>
    <rect x="0" y="54" width="140" height="24" rx="3" fill="#065f46" stroke="#10b981" stroke-width="2"/><text x="70" y="70" fill="#fff" font-weight="bold" font-size="10" text-anchor="middle">4. Transport (TCP)</text>
    <rect x="0" y="80" width="140" height="16" rx="2" fill="#1e293b"/><text x="70" y="92" fill="#64748b" font-size="8" text-anchor="middle">3. Network</text>
    <rect x="0" y="98" width="140" height="16" rx="2" fill="#1e293b"/><text x="70" y="110" fill="#64748b" font-size="8" text-anchor="middle">2. Data Link</text>
    <rect x="0" y="116" width="140" height="16" rx="2" fill="#1e293b"/><text x="70" y="128" fill="#64748b" font-size="8" text-anchor="middle">1. Physical</text>
  </g>
  <g transform="translate(200, 50)">
    <rect width="300" height="85" rx="5" fill="#1e293b" stroke="#10b981"/>
    <text x="15" y="24" fill="#34d399" font-size="11" font-weight="bold">Layer 4 Responsibilities:</text>
    <text x="15" y="44" fill="#cbd5e1" font-size="10">• End-to-end reliable transmission (TCP)</text>
    <text x="15" y="62" fill="#cbd5e1" font-size="10">• Flow control &amp; Congestion management</text>
    <text x="15" y="78" fill="#cbd5e1" font-size="10">• Segment sequencing &amp; Port addressing</text>
  </g>
</svg>