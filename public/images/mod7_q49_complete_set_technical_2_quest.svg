<svg viewBox="0 0 460 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <rect width="460" height="160" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="230" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CSS3 border-radius Visual Geometry</text>
  
  <!-- Rounded Opposite Corners Box -->
  <g transform="translate(60, 45)">
    <path d="M 20 0 L 80 0 L 80 60 Q 80 80 60 80 L 0 80 L 0 20 Q 0 0 20 0 Z" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
    <text x="40" y="100" fill="#cbd5e1" font-size="10" text-anchor="middle">border-radius: 20px 0 20px 0;</text>
  </g>

  <!-- Arrow -->
  <path d="M 200 85 L 240 85 M 235 80 L 240 85 L 235 90" fill="none" stroke="#64748b" stroke-width="2.5"/>

  <!-- Full Circle Box -->
  <g transform="translate(280, 45)">
    <rect x="0" y="0" width="80" height="80" rx="40" fill="#ec4899" stroke="#f472b6" stroke-width="2"/>
    <text x="40" y="100" fill="#cbd5e1" font-size="10" text-anchor="middle">border-radius: 50%; (Circle)</text>
  </g>
</svg>