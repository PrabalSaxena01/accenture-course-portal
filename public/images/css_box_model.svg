<svg viewBox="0 0 560 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="260" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="280" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">CSS BOX MODEL ARCHITECTURE</text>

  <!-- Margin (Orange) -->
  <g transform="translate(60, 42)">
    <rect width="440" height="195" rx="6" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="20" y="20" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">Margin (Outer Space)</text>

    <!-- Border (Yellow) -->
    <g transform="translate(40, 28)">
      <rect width="360" height="140" rx="5" fill="#713f12" fill-opacity="0.4" stroke="#eab308" stroke-width="2"/>
      <text x="18" y="18" fill="#eab308" font-family="monospace" font-size="11" font-weight="bold">Border</text>

      <!-- Padding (Green) -->
      <g transform="translate(40, 24)">
        <rect width="280" height="92" rx="4" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="2"/>
        <text x="15" y="18" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">Padding</text>

        <!-- Content (Blue) -->
        <g transform="translate(45, 22)">
          <rect width="190" height="50" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
          <text x="95" y="30" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Content (Width × Height)</text>
        </g>
      </g>
    </g>
  </g>
</svg>