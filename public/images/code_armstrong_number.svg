<svg viewBox="0 0 540 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">ARMSTRONG NUMBER VERIFICATION: N = 153</text>
  
  <g transform="translate(50, 45)">
    <!-- Digits calculation -->
    <rect x="0" y="0" width="80" height="45" rx="5" fill="#1e293b" stroke="#38bdf8"/>
    <text x="40" y="27" fill="#f8fafc" font-size="14" font-family="monospace" text-anchor="middle">1³ = 1</text>

    <text x="100" y="30" fill="#94a3b8" font-size="18" font-weight="bold">+</text>

    <rect x="120" y="0" width="80" height="45" rx="5" fill="#1e293b" stroke="#38bdf8"/>
    <text x="160" y="27" fill="#f8fafc" font-size="14" font-family="monospace" text-anchor="middle">5³ = 125</text>

    <text x="220" y="30" fill="#94a3b8" font-size="18" font-weight="bold">+</text>

    <rect x="240" y="0" width="80" height="45" rx="5" fill="#1e293b" stroke="#38bdf8"/>
    <text x="280" y="27" fill="#f8fafc" font-size="14" font-family="monospace" text-anchor="middle">3³ = 27</text>

    <text x="340" y="30" fill="#10b981" font-size="18" font-weight="bold">=</text>

    <rect x="360" y="0" width="80" height="45" rx="5" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="400" y="27" fill="#ffffff" font-size="16" font-weight="bold" font-family="monospace" text-anchor="middle">153 ✅</text>
  </g>
  <text x="270" y="135" fill="#94a3b8" font-size="11" text-anchor="middle">Sum of each digit raised to power of total digit count d=3 matches input 153</text>
</svg>