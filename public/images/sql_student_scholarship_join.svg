<svg viewBox="0 0 650 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <rect width="650" height="220" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="325" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">SQL TRIPLE INNER JOIN SCHEMA: STUDENT / SCHOLARSHIP / PROGRAM</text>
  
  <!-- Program Table -->
  <g transform="translate(20, 45)">
    <rect width="180" height="140" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="180" height="26" rx="6" fill="#1d4ed8"/>
    <text x="90" y="18" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Program</text>
    <text x="12" y="46" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="bold">🔑 PROGRAM_ID (PK)</text>
    <text x="12" y="70" fill="#38bdf8" font-family="monospace" font-size="10">🔗 STUDENT_REF_ID</text>
    <text x="12" y="94" fill="#cbd5e1" font-family="monospace" font-size="10">   PROGRAM_NAME</text>
    <text x="12" y="118" fill="#cbd5e1" font-family="monospace" font-size="10">   DEPARTMENT</text>
  </g>

  <!-- Central Student Table -->
  <g transform="translate(235, 45)">
    <rect width="180" height="140" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="180" height="26" rx="6" fill="#059669"/>
    <text x="90" y="18" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Student (Primary)</text>
    <text x="12" y="46" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">🔑 STUDENT_ID (PK)</text>
    <text x="12" y="70" fill="#cbd5e1" font-family="monospace" font-size="10">   FIRST_NAME</text>
    <text x="12" y="94" fill="#cbd5e1" font-family="monospace" font-size="10">   LAST_NAME</text>
    <text x="12" y="118" fill="#cbd5e1" font-family="monospace" font-size="10">   GPA</text>
  </g>

  <!-- Scholarship Table -->
  <g transform="translate(450, 45)">
    <rect width="180" height="140" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <rect width="180" height="26" rx="6" fill="#ca8a04"/>
    <text x="90" y="18" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Scholarship</text>
    <text x="12" y="46" fill="#fde047" font-family="monospace" font-size="10" font-weight="bold">🔑 SCHOLARSHIP_ID</text>
    <text x="12" y="70" fill="#38bdf8" font-family="monospace" font-size="10">🔗 STUDENT_REF_ID</text>
    <text x="12" y="94" fill="#cbd5e1" font-family="monospace" font-size="10">   SCHOLARSHIP_AMT</text>
    <text x="12" y="118" fill="#cbd5e1" font-family="monospace" font-size="10">   DISBURSED_DATE</text>
  </g>

  <!-- Connectors -->
  <path d="M 200 70 L 235 70" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 415 70 L 450 70" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="200" cy="70" r="3" fill="#38bdf8"/>
  <circle cx="415" cy="70" r="3" fill="#38bdf8"/>
</svg>