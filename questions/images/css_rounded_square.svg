<svg viewBox="0 0 540 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="220" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">CSS3 BORDER-RADIUS: ALTERNATING CORNERS</text>

  <!-- The Styled Shape: Top-Left=20px, Top-Right=0, Bottom-Right=20px, Bottom-Left=0 -->
  <g transform="translate(70, 50)">
    <!-- Path with specific corner radii -->
    <path d="M 20,0 L 120,0 L 120,100 A 20,20 0 0,1 100,120 L 0,120 L 0,20 A 20,20 0 0,1 20,0 Z" 
          fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="60" y="65" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">120 × 120</text>
    
    <!-- Corner indicators -->
    <circle cx="20" cy="20" r="14" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="32" y="32" fill="#eab308" font-size="9" font-family="monospace">r=20</text>
    
    <circle cx="100" cy="100" r="14" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="88" y="94" fill="#eab308" font-size="9" font-family="monospace">r=20</text>

    <!-- Sharp corner indicators -->
    <rect x="110" y="0" width="10" height="10" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="0" y="110" width="10" height="10" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
  </g>

  <!-- CSS Code Panel -->
  <g transform="translate(240, 50)">
    <rect width="260" height="120" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="15" y="24" fill="#94a3b8" font-family="monospace" font-size="11">.rounded-square {</text>
    <text x="25" y="46" fill="#cbd5e1" font-family="monospace" font-size="11">  width: 120px;</text>
    <text x="25" y="66" fill="#cbd5e1" font-family="monospace" font-size="11">  height: 120px;</text>
    <text x="25" y="88" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">  border-radius: 20px 0 20px 0;</text>
    <text x="15" y="108" fill="#94a3b8" font-family="monospace" font-size="11">}</text>
  </g>
  <text x="370" y="195" fill="#eab308" font-size="10" font-family="monospace" text-anchor="middle">TL=20px, TR=0, BR=20px, BL=0</text>
</svg>