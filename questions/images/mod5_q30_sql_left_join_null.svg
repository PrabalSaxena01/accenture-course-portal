<svg viewBox="0 0 540 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="160" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
  <text x="270" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">SQL LEFT JOIN: FILTERING UNMATCHED (NULL) RECORDS</text>
  <g transform="translate(30, 42)">
    <rect width="480" height="95" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="26" fill="#f8fafc" font-family="monospace" font-size="11">SELECT s.StudentName FROM Students s</text>
    <text x="20" y="48" fill="#38bdf8" font-family="monospace" font-size="11">LEFT JOIN StudentMarks m ON s.StudentID = m.StudentID</text>
    <text x="20" y="72" fill="#eab308" font-family="monospace" font-size="12" font-weight="bold">WHERE m.Mark IS NULL;</text>
    <text x="20" y="90" fill="#a7f3d0" font-family="sans-serif" font-size="10">↳ Returns all enrolled students who have no recorded exam marks</text>
  </g>
</svg>