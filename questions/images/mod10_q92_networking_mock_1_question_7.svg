<svg viewBox="0 0 480 150" width="100%" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="240" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Host-to-Host Direct Ethernet Link Topology</text>
  
  <g transform="translate(50, 45)">
    <rect width="80" height="60" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="5"/>
    <text x="40" y="28" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Host A</text>
    <text x="40" y="46" fill="#94a3b8" font-size="9" text-anchor="middle">192.168.1.10</text>
  </g>

  <!-- Ethernet Cable (Crossover) -->
  <g transform="translate(140, 65)">
    <line x1="0" y1="10" x2="200" y2="10" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="100" y="0" fill="#f43f5e" font-size="10" font-weight="bold" text-anchor="middle">Requires Crossover Cable</text>
    <text x="100" y="26" fill="#94a3b8" font-size="9" text-anchor="middle">(Pins 1 & 3, 2 & 6 Cross-Wired)</text>
  </g>

  <g transform="translate(350, 45)">
    <rect width="80" height="60" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="5"/>
    <text x="40" y="28" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Host B</text>
    <text x="40" y="46" fill="#94a3b8" font-size="9" text-anchor="middle">192.168.1.11</text>
  </g>
</svg>