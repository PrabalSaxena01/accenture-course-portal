<svg viewBox="0 0 540 210" width="100%" height="210" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="210" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="24" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">OBJECT-ORIENTED INHERITANCE: class Dog extends Animal</text>

  <!-- Superclass: Animal -->
  <g transform="translate(40, 45)">
    <rect width="190" height="135" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="190" height="28" rx="6" fill="#0284c7"/>
    <text x="95" y="19" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Animal (Superclass)</text>
    <text x="12" y="48" fill="#cbd5e1" font-family="monospace" font-size="10">- name: String</text>
    <text x="12" y="68" fill="#cbd5e1" font-family="monospace" font-size="10">- age: int</text>
    <line x1="8" y1="78" x2="182" y2="78" stroke="#334155"/>
    <text x="12" y="96" fill="#38bdf8" font-family="monospace" font-size="10">+ eat(): void</text>
    <text x="12" y="116" fill="#38bdf8" font-family="monospace" font-size="10">+ makeSound(): void</text>
  </g>

  <!-- Inheritance Arrow: UML Generalization -->
  <g transform="translate(235, 105)">
    <line x1="75" y1="10" x2="15" y2="10" stroke="#a855f7" stroke-width="2.5"/>
    <polygon points="15,10 25,4 25,16" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="45" y="-2" fill="#e879f9" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">extends</text>
  </g>

  <!-- Subclass: Dog -->
  <g transform="translate(315, 45)">
    <rect width="190" height="135" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect width="190" height="28" rx="6" fill="#7e22ce"/>
    <text x="95" y="19" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Dog (Subclass)</text>
    <text x="12" y="48" fill="#cbd5e1" font-family="monospace" font-size="10">- breed: String</text>
    <line x1="8" y1="62" x2="182" y2="62" stroke="#334155"/>
    <text x="12" y="80" fill="#e879f9" font-family="monospace" font-size="10">+ bark(): void</text>
    <text x="12" y="100" fill="#34d399" font-family="monospace" font-size="10">@Override makeSound()</text>
    <text x="12" y="120" fill="#cbd5e1" font-family="monospace" font-size="9" font-style="italic">// inherits name, age, eat</text>
  </g>
</svg>