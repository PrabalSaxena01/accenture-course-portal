<svg viewBox="0 0 540 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">JAVASCRIPT OBJECT: DUPLICATE KEY OVERWRITE RULE</text>

  <!-- Input Object with Duplicate -->
  <g transform="translate(35, 45)">
    <rect width="210" height="90" rx="6" fill="#1e293b" stroke="#f43f5e"/>
    <text x="15" y="24" fill="#94a3b8" font-family="monospace" font-size="10">const obj = {</text>
    <text x="25" y="42" fill="#f43f5e" font-family="monospace" font-size="10" text-decoration="line-through">  first: 20,</text>
    <text x="25" y="58" fill="#cbd5e1" font-family="monospace" font-size="10">  second: 30,</text>
    <text x="25" y="74" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">  first: 50</text>
    <text x="15" y="86" fill="#94a3b8" font-family="monospace" font-size="10">};</text>
  </g>

  <!-- Overwrite arrow -->
  <g transform="translate(265, 80)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#10b981" stroke-width="2"/>
    <polygon points="40,10 32,6 32,14" fill="#10b981"/>
    <text x="20" y="-4" fill="#10b981" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">Latter Wins</text>
  </g>

  <!-- Final Evaluated Object -->
  <g transform="translate(325, 45)">
    <rect width="180" height="90" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="15" y="28" fill="#a7f3d0" font-family="monospace" font-size="11">Result in Memory:</text>
    <text x="20" y="52" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">{</text>
    <text x="30" y="68" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">  first: 50,</text>
    <text x="30" y="84" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">  second: 30</text>
    <text x="20" y="88" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">}</text>
  </g>
  <text x="270" y="158" fill="#94a3b8" font-size="10" text-anchor="middle">ECMAScript specification: Last defined property key overwrites prior definitions.</text>
</svg>