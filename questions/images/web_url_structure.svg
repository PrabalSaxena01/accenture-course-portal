<svg viewBox="0 0 600 170" width="100%" height="170" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="170" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="300" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">ANATOMY OF A WEB URL / URI STRUCTURE</text>

  <!-- URL Component Boxes -->
  <g transform="translate(30, 48)">
    <!-- Scheme -->
    <rect x="0" y="0" width="75" height="40" rx="4" fill="#1e293b" stroke="#38bdf8"/>
    <text x="37" y="24" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">scheme</text>
    <text x="37" y="55" fill="#94a3b8" font-size="9" text-anchor="middle">https://</text>

    <!-- Host / Domain -->
    <rect x="85" y="0" width="160" height="40" rx="4" fill="#1e293b" stroke="#10b981"/>
    <text x="165" y="24" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">prefix.domain</text>
    <text x="165" y="55" fill="#94a3b8" font-size="9" text-anchor="middle">www.accenture.com</text>

    <!-- Port -->
    <rect x="255" y="0" width="60" height="40" rx="4" fill="#1e293b" stroke="#eab308"/>
    <text x="285" y="24" fill="#eab308" font-family="monospace" font-size="11" text-anchor="middle">:port</text>
    <text x="285" y="55" fill="#94a3b8" font-size="9" text-anchor="middle">:443</text>

    <!-- Path & File -->
    <rect x="325" y="0" width="215" height="40" rx="4" fill="#1e293b" stroke="#a855f7"/>
    <text x="432" y="24" fill="#a855f7" font-family="monospace" font-size="11" text-anchor="middle">/path/filename</text>
    <text x="432" y="55" fill="#94a3b8" font-size="9" text-anchor="middle">/assessment/mock1.html</text>
  </g>

  <text x="300" y="145" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">scheme://prefix.domain:port/path/filename</text>
</svg>