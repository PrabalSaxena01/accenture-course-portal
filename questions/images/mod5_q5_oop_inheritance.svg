<svg viewBox="0 0 540 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="180" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
  <text x="270" y="22" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">OOP INHERITANCE: class Dog extends Animal</text>
  <g transform="translate(40, 42)">
    <rect width="180" height="115" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="180" height="24" rx="5" fill="#0284c7"/>
    <text x="90" y="16" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Animal (Superclass)</text>
    <text x="10" y="42" fill="#cbd5e1" font-family="monospace" font-size="10">- name: String</text>
    <line x1="5" y1="52" x2="175" y2="52" stroke="#334155"/>
    <text x="10" y="72" fill="#38bdf8" font-family="monospace" font-size="10">+ eat(): void</text>
    <text x="10" y="92" fill="#38bdf8" font-family="monospace" font-size="10">+ makeSound(): void</text>
  </g>
  <g transform="translate(230, 95)">
    <line x1="75" y1="5" x2="15" y2="5" stroke="#a855f7" stroke-width="2"/>
    <polygon points="15,5 25,0 25,10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="45" y="-5" fill="#e879f9" font-size="9" font-weight="bold" text-anchor="middle">extends</text>
  </g>
  <g transform="translate(320, 42)">
    <rect width="180" height="115" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect width="180" height="24" rx="5" fill="#7e22ce"/>
    <text x="90" y="16" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Dog (Subclass)</text>
    <text x="10" y="42" fill="#cbd5e1" font-family="monospace" font-size="10">- breed: String</text>
    <line x1="5" y1="52" x2="175" y2="52" stroke="#334155"/>
    <text x="10" y="72" fill="#e879f9" font-family="monospace" font-size="10">+ bark(): void</text>
    <text x="10" y="92" fill="#34d399" font-family="monospace" font-size="10">@Override makeSound()</text>
  </g>
</svg>