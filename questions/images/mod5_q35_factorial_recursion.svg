<svg viewBox="0 0 540 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="160" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
  <text x="270" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">RECURSION CALL TREE: cal(n) = n * cal(n-1) (FACTORIAL)</text>
  <g transform="translate(60, 48)">
    <rect width="80" height="30" rx="4" fill="#0284c7"/><text x="40" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">cal(4) = 4 *</text>
    <path d="M 85 15 L 125 15" stroke="#38bdf8" stroke-width="2"/>
    <rect x="130" width="80" height="30" rx="4" fill="#0284c7"/><text x="170" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">cal(3) = 3 *</text>
    <path d="M 215 15 L 255 15" stroke="#38bdf8" stroke-width="2"/>
    <rect x="260" width="80" height="30" rx="4" fill="#0284c7"/><text x="300" y="19" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">cal(2) = 2 *</text>
    <path d="M 345 15 L 385 15" stroke="#38bdf8" stroke-width="2"/>
    <rect x="390" width="70" height="30" rx="4" fill="#065f46"/><text x="425" y="19" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">cal(1) = 1</text>
  </g>
  <text x="270" y="125" fill="#10b981" font-weight="bold" font-family="monospace" font-size="12" text-anchor="middle">cal(4) = 4 × 3 × 2 × 1 = 24  ➔ Computes Factorial</text>
</svg>