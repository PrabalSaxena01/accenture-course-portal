<svg viewBox="0 0 560 190" width="100%" height="190" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="190" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="280" y="24" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">CODING ALGORITHM: 2D STRING GRID UNIFORMITY</text>

  <g transform="translate(80, 45)">
    <!-- 3x3 Grid of uniform string lengths (length = 3) -->
    <rect x="0" y="0" width="45" height="35" rx="3" fill="#3b0764" stroke="#c084fc"/>
    <text x="22" y="22" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">"abc"</text>
    <rect x="55" y="0" width="45" height="35" rx="3" fill="#3b0764" stroke="#c084fc"/>
    <text x="77" y="22" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">"def"</text>
    <rect x="110" y="0" width="45" height="35" rx="3" fill="#3b0764" stroke="#c084fc"/>
    <text x="132" y="22" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">"ghi"</text>

    <rect x="0" y="42" width="45" height="35" rx="3" fill="#3b0764" stroke="#c084fc"/>
    <text x="22" y="64" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">"jkl"</text>
    <rect x="55" y="42" width="45" height="35" rx="3" fill="#3b0764" stroke="#c084fc"/>
    <text x="77" y="64" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">"mno"</text>
    <rect x="110" y="42" width="45" height="35" rx="3" fill="#3b0764" stroke="#c084fc"/>
    <text x="132" y="64" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">"pqr"</text>

    <rect x="0" y="84" width="45" height="35" rx="3" fill="#3b0764" stroke="#c084fc"/>
    <text x="22" y="106" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">"stu"</text>
    <rect x="55" y="84" width="45" height="35" rx="3" fill="#3b0764" stroke="#c084fc"/>
    <text x="77" y="106" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">"vwx"</text>
    <rect x="110" y="84" width="45" height="35" rx="3" fill="#3b0764" stroke="#c084fc"/>
    <text x="132" y="106" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">"yza"</text>
  </g>

  <!-- Status & Explanation -->
  <g transform="translate(280, 55)">
    <rect width="210" height="95" rx="6" fill="#1e293b" stroke="#10b981"/>
    <text x="105" y="28" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">✅ Grid Uniform: TRUE</text>
    <text x="15" y="52" fill="#cbd5e1" font-size="10" font-family="sans-serif">All rows &amp; columns have</text>
    <text x="15" y="68" fill="#cbd5e1" font-size="10" font-family="sans-serif">identical length L = 3.</text>
    <text x="15" y="84" fill="#94a3b8" font-size="9" font-family="sans-serif">Time Complexity: O(R × C)</text>
  </g>
</svg>