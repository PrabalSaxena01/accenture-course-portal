<svg viewBox="0 0 560 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="280" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">JAVASCRIPT ARRAY PIPELINE: [3, 16, 2, 18].map(x =&gt; x + 5)</text>
  
  <!-- Input Array -->
  <g transform="translate(35, 50)">
    <text x="80" y="-8" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">Original Array</text>
    <rect x="0" y="0" width="40" height="40" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="20" y="25" fill="#f8fafc" font-weight="bold" font-family="monospace" text-anchor="middle">3</text>
    <rect x="45" y="0" width="40" height="40" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="65" y="25" fill="#f8fafc" font-weight="bold" font-family="monospace" text-anchor="middle">16</text>
    <rect x="90" y="0" width="40" height="40" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="110" y="25" fill="#f8fafc" font-weight="bold" font-family="monospace" text-anchor="middle">2</text>
    <rect x="135" y="0" width="40" height="40" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="155" y="25" fill="#f8fafc" font-weight="bold" font-family="monospace" text-anchor="middle">18</text>
  </g>

  <!-- Transform Operator -->
  <g transform="translate(230, 52)">
    <circle cx="35" cy="18" r="22" fill="#7e22ce" stroke="#c084fc"/>
    <text x="35" y="23" fill="#fff" font-weight="bold" font-family="monospace" font-size="14" text-anchor="middle">+ 5</text>
  </g>

  <!-- Arrow -->
  <path d="M 305 70 L 335 70 M 330 65 L 335 70 L 330 75" fill="none" stroke="#64748b" stroke-width="2.5"/>

  <!-- Output Array -->
  <g transform="translate(355, 50)">
    <text x="80" y="-8" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">Result: [8, 21, 7, 23]</text>
    <rect x="0" y="0" width="40" height="40" fill="#065f46" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="20" y="25" fill="#fff" font-weight="bold" font-family="monospace" text-anchor="middle">8</text>
    <rect x="45" y="0" width="40" height="40" fill="#065f46" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="65" y="25" fill="#fff" font-weight="bold" font-family="monospace" text-anchor="middle">21</text>
    <rect x="90" y="0" width="40" height="40" fill="#065f46" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="110" y="25" fill="#fff" font-weight="bold" font-family="monospace" text-anchor="middle">7</text>
    <rect x="135" y="0" width="40" height="40" fill="#065f46" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="155" y="25" fill="#fff" font-weight="bold" font-family="monospace" text-anchor="middle">23</text>
  </g>
</svg>