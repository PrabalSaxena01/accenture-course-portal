<svg viewBox="0 0 540 190" width="100%" height="190" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="190" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="24" fill="#eab308" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">BITWISE LOGIC EVALUATION: x = 6, y = 10</text>

  <g transform="translate(60, 45)">
    <rect width="420" height="120" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="20" y="28" fill="#cbd5e1" font-family="monospace" font-size="11">x     =  6  ➔  0 0 0 0  0 1 1 0</text>
    <text x="20" y="48" fill="#cbd5e1" font-family="monospace" font-size="11">y     = 10  ➔  0 0 0 0  1 0 1 0</text>
    <line x1="15" y1="58" x2="405" y2="58" stroke="#334155"/>
    <text x="20" y="76" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">x &amp; y =  2  ➔  0 0 0 0  0 0 1 0  (AND: bitwise product)</text>
    <text x="20" y="94" fill="#a855f7" font-family="monospace" font-size="11" font-weight="bold">x ^ y = 12  ➔  0 0 0 0  1 1 0 0  (XOR: bitwise difference)</text>
    <text x="20" y="112" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">x | y = 14  ➔  0 0 0 0  1 1 1 0  (OR: bitwise union)</text>
  </g>
</svg>