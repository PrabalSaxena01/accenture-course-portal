<svg viewBox="0 0 540 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="160" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
  <text x="270" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">CLASS (BLUEPRINT) VS OBJECT (INSTANCE IN HEAP)</text>
  <g transform="translate(40, 42)">
    <rect width="180" height="95" rx="5" fill="#1e293b" stroke="#38bdf8"/>
    <text x="90" y="22" fill="#38bdf8" font-weight="bold" font-size="11" text-anchor="middle">class Car { ... }</text>
    <text x="15" y="46" fill="#cbd5e1" font-size="10">• Defines properties (color, speed)</text>
    <text x="15" y="66" fill="#cbd5e1" font-size="10">• Defines methods (accelerate)</text>
    <text x="90" y="86" fill="#94a3b8" font-size="9" text-anchor="middle">Compile-Time Template</text>
  </g>
  <path d="M 230 90 L 290 90 M 285 85 L 290 90 L 285 95" stroke="#a855f7" stroke-width="2" fill="none"/>
  <text x="260" y="80" fill="#a855f7" font-size="9" text-anchor="middle">new Car()</text>
  <g transform="translate(305, 42)">
    <rect width="195" height="95" rx="5" fill="#1e1e38" stroke="#a855f7" stroke-width="1.5"/>
    <text x="97" y="22" fill="#c084fc" font-weight="bold" font-size="11" text-anchor="middle">myCar = new Car();</text>
    <text x="15" y="46" fill="#f8fafc" font-size="10">color: "Crimson Red"</text>
    <text x="15" y="66" fill="#f8fafc" font-size="10">speed: 120 km/h</text>
    <text x="97" y="86" fill="#10b981" font-size="9" text-anchor="middle">Runtime Instance @ Heap 0x4F1A</text>
  </g>
</svg>