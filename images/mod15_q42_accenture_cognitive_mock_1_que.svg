<svg viewBox="0 0 520 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="160" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="260" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Paper Folding & Punch Unfolding Blueprint</text>
  
  <!-- Step X -->
  <g transform="translate(30, 35)">
    <rect x="0" y="0" width="80" height="80" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="80" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3"/>
    <path d="M 50 40 L 30 40 M 35 35 L 30 40 L 35 45" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <text x="40" y="102" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">Figure X (1st Fold)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 130 75 L 155 75 M 150 70 L 155 75 L 150 80" fill="none" stroke="#64748b" stroke-width="2.5"/>

  <!-- Step Y -->
  <g transform="translate(175, 35)">
    <rect x="0" y="0" width="40" height="80" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="40" x2="40" y2="40" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3"/>
    <path d="M 20 50 L 20 30 M 15 35 L 20 30 L 25 35" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <text x="20" y="102" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">Figure Y (2nd Fold)</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 235 75 L 260 75 M 255 70 L 260 75 L 255 80" fill="none" stroke="#64748b" stroke-width="2.5"/>

  <!-- Step Z (Hole Punch) -->
  <g transform="translate(280, 55)">
    <rect x="0" y="0" width="40" height="40" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="20" cy="20" r="6" fill="#f43f5e"/>
    <text x="20" y="62" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">Figure Z (Punch)</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 345 75 L 370 75 M 365 70 L 370 75 L 365 80" fill="none" stroke="#64748b" stroke-width="2.5"/>

  <!-- Unfolded Target Solution -->
  <g transform="translate(390, 35)">
    <rect x="0" y="0" width="80" height="80" fill="#0f172a" stroke="#10b981" stroke-width="2.5" rx="3"/>
    <circle cx="20" cy="20" r="5" fill="#10b981"/>
    <circle cx="60" cy="20" r="5" fill="#10b981"/>
    <circle cx="20" cy="60" r="5" fill="#10b981"/>
    <circle cx="60" cy="60" r="5" fill="#10b981"/>
    <text x="40" y="102" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">Unfolded Result</text>
  </g>
</svg>