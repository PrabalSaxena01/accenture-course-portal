<svg viewBox="0 0 540 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="160" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
  <text x="270" y="22" fill="#eab308" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">PSEUDOCODE BITWISE LOOP TRACE: a=8, b=5, c=6</text>
  <g transform="translate(30, 42)">
    <rect width="480" height="98" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="24" fill="#94a3b8" font-family="monospace" font-size="10">Iter 1: c = c ^ (a &amp; b) = 6 ^ 0 = 6</text>
    <text x="15" y="44" fill="#94a3b8" font-family="monospace" font-size="10">Iter 2: b = (b + a) &gt;&gt; 1 = 13 &gt;&gt; 1 = 6</text>
    <text x="15" y="64" fill="#94a3b8" font-family="monospace" font-size="10">Final Accumulator: (a + b + c) * 3 + b = (8 + 6 + 6)*3 + 5</text>
    <text x="15" y="86" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">↳ Evaluates to: 65</text>
  </g>
</svg>