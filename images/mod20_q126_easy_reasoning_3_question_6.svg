<svg viewBox="0 0 450 170" width="100%" height="170" xmlns="http://www.w3.org/2000/svg">
  <rect width="450" height="170" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="225" y="24" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Accenture Matrix Pattern Grid (Row/Column Logic)</text>
  <g transform="translate(90, 38)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="80" height="36" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="40" y="23" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">11</text>
    <rect x="0" y="42" width="80" height="36" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="40" y="65" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">1</text>
    <rect x="0" y="84" width="80" height="36" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
    <text x="40" y="107" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">120</text>

    <!-- Column 2 -->
    <rect x="95" y="0" width="80" height="36" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="135" y="23" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">7</text>
    <rect x="95" y="42" width="80" height="36" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="135" y="65" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">2</text>
    <rect x="95" y="84" width="80" height="36" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
    <text x="135" y="107" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">45</text>

    <!-- Column 3 -->
    <rect x="190" y="0" width="80" height="36" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="230" y="23" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">6</text>
    <rect x="190" y="42" width="80" height="36" fill="#1e293b" stroke="#475569" rx="4"/>
    <text x="230" y="65" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">3</text>
    <rect x="190" y="84" width="80" height="36" fill="#3b0764" stroke="#c084fc" stroke-width="2" rx="4"/>
    <text x="230" y="108" fill="#e879f9" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">?</text>
  </g>
  <text x="225" y="162" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Formula: Column_1² − Column_2² = Target Value (6² − 3² = 27)</text>
</svg>