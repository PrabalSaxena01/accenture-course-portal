<svg viewBox="0 0 560 190" width="100%" height="190" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="190" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="280" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">OS I/O SUBSYSTEM: HARDWARE DEVICE DRIVERS</text>

  <!-- Layers -->
  <g transform="translate(60, 45)">
    <!-- User Level Application -->
    <rect x="0" y="0" width="440" height="28" rx="4" fill="#1e293b" stroke="#38bdf8"/>
    <text x="220" y="18" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">User Application (Word / Browser / HR App)</text>

    <!-- OS Kernel / Device Subsystem -->
    <rect x="0" y="38" width="440" height="28" rx="4" fill="#0369a1" stroke="#38bdf8"/>
    <text x="220" y="56" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Operating System Kernel (I/O Subsystem &amp; Spooler)</text>

    <!-- Device Drivers Layer -->
    <rect x="0" y="76" width="440" height="28" rx="4" fill="#065f46" stroke="#10b981"/>
    <text x="220" y="94" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Device Drivers (Printer Driver / Scanner Driver / SCSI)</text>

    <!-- Physical Hardware -->
    <rect x="0" y="114" width="440" height="28" rx="4" fill="#1e293b" stroke="#94a3b8"/>
    <text x="220" y="132" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Hardware Peripherals: Network Printers, Scanners, SSDs</text>
  </g>
</svg>