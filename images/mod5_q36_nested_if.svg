<svg viewBox="0 0 540 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="160" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
  <text x="270" y="22" fill="#eab308" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">NESTED CONDITIONAL BRANCH TRACE: a=0, b=2, c=7</text>
  <g transform="translate(40, 45)">
    <rect width="130" height="40" rx="4" fill="#1e293b" stroke="#38bdf8"/><text x="65" y="24" fill="#38bdf8" font-size="10" text-anchor="middle">if (a &gt; 0) ➔ FALSE</text>
  </g>
  <path d="M 175 65 L 215 65" stroke="#eab308" stroke-width="2"/>
  <g transform="translate(220, 45)">
    <rect width="140" height="40" rx="4" fill="#1e293b" stroke="#eab308"/><text x="70" y="24" fill="#eab308" font-size="10" text-anchor="middle">else if (b &gt; 1) ➔ TRUE</text>
  </g>
  <path d="M 365 65 L 405 65" stroke="#10b981" stroke-width="2"/>
  <g transform="translate(410, 45)">
    <rect width="90" height="40" rx="4" fill="#065f46" stroke="#10b981"/><text x="45" y="24" fill="#fff" font-weight="bold" font-size="11" text-anchor="middle">b + c = 9</text>
  </g>
  <text x="270" y="130" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">Branch resolves to 9</text>
</svg>