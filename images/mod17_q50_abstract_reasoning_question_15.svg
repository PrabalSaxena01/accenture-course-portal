<svg viewBox="0 0 500 150" width="100%" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="250" y="22" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Clockwise 90° Incremental Rotation Pattern</text>
  
  <!-- Step 1 -->
  <g transform="translate(30, 35)">
    <rect width="65" height="65" fill="#1e293b" stroke="#64748b" rx="4"/>
    <circle cx="18" cy="18" r="8" fill="#38bdf8"/>
    <text x="32" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">Step 1 (0°)</text>
  </g>
  <path d="M 110 67 L 125 67 M 120 62 L 125 67 L 120 72" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- Step 2 -->
  <g transform="translate(145, 35)">
    <rect width="65" height="65" fill="#1e293b" stroke="#64748b" rx="4"/>
    <circle cx="47" cy="18" r="8" fill="#38bdf8"/>
    <text x="32" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">Step 2 (90°)</text>
  </g>
  <path d="M 225 67 L 240 67 M 235 62 L 240 67 L 235 72" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- Step 3 -->
  <g transform="translate(260, 35)">
    <rect width="65" height="65" fill="#1e293b" stroke="#64748b" rx="4"/>
    <circle cx="47" cy="47" r="8" fill="#38bdf8"/>
    <text x="32" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">Step 3 (180°)</text>
  </g>
  <path d="M 340 67 L 355 67 M 350 62 L 355 67 L 350 72" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- Step 4 Solution -->
  <g transform="translate(375, 35)">
    <rect width="65" height="65" fill="#1e1e38" stroke="#a855f7" stroke-width="2" rx="4"/>
    <circle cx="18" cy="47" r="8" fill="#e879f9"/>
    <text x="32" y="85" fill="#a855f7" font-size="10" font-weight="bold" text-anchor="middle">Step 4 (270°)</text>
  </g>
  <text x="250" y="138" fill="#94a3b8" font-size="11" text-anchor="middle">4th rotation completes 360° cycle returning to origin</text>
</svg>