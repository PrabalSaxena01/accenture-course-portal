<svg viewBox="0 0 460 150" width="100%" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect width="460" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="230" y="22" fill="#e879f9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Syllogistic Venn Diagram Representation</text>
  
  <g transform="translate(80, 20)">
    <!-- Set A -->
    <circle cx="100" cy="65" r="45" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="2"/>
    <text x="75" y="70" fill="#93c5fd" font-size="11" font-weight="bold">Premise 1</text>
    
    <!-- Set B -->
    <circle cx="170" cy="65" r="45" fill="#ec4899" fill-opacity="0.3" stroke="#f472b6" stroke-width="2"/>
    <text x="180" y="70" fill="#fbcfe8" font-size="11" font-weight="bold">Premise 2</text>

    <!-- Overlap -->
    <text x="135" y="70" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Overlap</text>
  </g>
  <text x="230" y="138" fill="#94a3b8" font-size="10" text-anchor="middle">Strict intersection rules determine conclusion validity</text>
</svg>