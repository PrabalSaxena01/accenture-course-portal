<svg viewBox="0 0 580 210" width="100%" height="210" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="210" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="290" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">SQL RELATIONAL INNER JOIN (INTERSECTION SET)</text>

  <!-- Left Table Circle -->
  <circle cx="230" cy="115" r="70" fill="#1e293b" stroke="#3b82f6" stroke-width="2" fill-opacity="0.6"/>
  <text x="190" y="118" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Table A</text>

  <!-- Right Table Circle -->
  <circle cx="350" cy="115" r="70" fill="#1e293b" stroke="#10b981" stroke-width="2" fill-opacity="0.6"/>
  <text x="390" y="118" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Table B</text>

  <!-- Intersection Clip Path -->
  <path d="M 290,57 A 70,70 0 0,1 290,173 A 70,70 0 0,1 290,57 Z" fill="#38bdf8" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="290" y="118" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">A ∩ B</text>

  <!-- Explanation -->
  <text x="290" y="195" fill="#cbd5e1" font-size="11" font-family="sans-serif" text-anchor="middle">SELECT * FROM TableA INNER JOIN TableB ON TableA.id = TableB.id</text>
</svg>