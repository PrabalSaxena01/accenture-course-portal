<svg viewBox="0 0 540 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="160" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
  <text x="270" y="22" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">BITWISE XOR &amp; SHIFT REGISTER TRACE: p=4, q=8, r=6</text>
  <g transform="translate(40, 45)">
    <rect width="460" height="90" rx="5" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="24" fill="#cbd5e1" font-family="monospace" font-size="10">p = 4 (0100), q = 8 (1000), r = 6 (0110)</text>
    <text x="15" y="44" fill="#38bdf8" font-family="monospace" font-size="10">p ^ q = 12 (1100), r = (r + 1) ^ p</text>
    <text x="15" y="64" fill="#cbd5e1" font-family="monospace" font-size="10">Accumulator: p * 4 + q + r</text>
    <text x="15" y="82" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">Output: 55</text>
  </g>
</svg>