<svg viewBox="0 0 540 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">HTML5 CLICKABLE IMAGE ANCHOR: &lt;a href&gt;&lt;img src&gt;&lt;/a&gt;</text>

  <!-- Visual Representation -->
  <g transform="translate(60, 48)">
    <rect width="420" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="30" fill="#cbd5e1" font-family="monospace" font-size="12">&lt;<tspan fill="#38bdf8">a</tspan> <tspan fill="#eab308">href</tspan>=<tspan fill="#a3e635">"portal.html"</tspan>&gt;&lt;<tspan fill="#38bdf8">img</tspan> <tspan fill="#eab308">src</tspan>=<tspan fill="#a3e635">"logo.png"</tspan> <tspan fill="#eab308">alt</tspan>=<tspan fill="#a3e635">"Accenture"</tspan>/&gt;&lt;/<tspan fill="#38bdf8">a</tspan>&gt;</text>
  </g>

  <g transform="translate(60, 110)">
    <rect width="420" height="45" rx="6" fill="#022c22" stroke="#059669"/>
    <text x="210" y="28" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Wraps image within anchor tag to trigger navigation on click</text>
  </g>
</svg>