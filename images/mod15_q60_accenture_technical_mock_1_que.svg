<svg viewBox="0 0 480 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="160" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="240" y="22" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Excel Cell Merge Architecture (Upper-Left Rule)</text>
  
  <!-- Before Grid -->
  <g transform="translate(40, 40)">
    <text x="70" y="-8" fill="#94a3b8" font-size="10" text-anchor="middle">Original Range (A1:D2)</text>
    <rect x="0" y="0" width="35" height="24" fill="#065f46" stroke="#10b981"/>
    <text x="17" y="16" fill="#fff" font-weight="bold" font-size="12" text-anchor="middle">1</text>
    <rect x="35" y="0" width="35" height="24" fill="#1e293b" stroke="#475569"/>
    <text x="52" y="16" fill="#94a3b8" font-size="11" text-anchor="middle">5</text>
    <rect x="70" y="0" width="35" height="24" fill="#1e293b" stroke="#475569"/>
    <text x="87" y="16" fill="#94a3b8" font-size="11" text-anchor="middle">9</text>
    <rect x="105" y="0" width="35" height="24" fill="#1e293b" stroke="#475569"/>
    <text x="122" y="16" fill="#94a3b8" font-size="11" text-anchor="middle">3</text>
    
    <rect x="0" y="24" width="35" height="24" fill="#1e293b" stroke="#475569"/>
    <text x="17" y="40" fill="#94a3b8" font-size="11" text-anchor="middle">4</text>
    <rect x="35" y="24" width="35" height="24" fill="#1e293b" stroke="#475569"/>
    <text x="52" y="40" fill="#94a3b8" font-size="11" text-anchor="middle">8</text>
    <rect x="70" y="24" width="35" height="24" fill="#1e293b" stroke="#475569"/>
    <text x="87" y="40" fill="#94a3b8" font-size="11" text-anchor="middle">2</text>
    <rect x="105" y="24" width="35" height="24" fill="#1e293b" stroke="#475569"/>
    <text x="122" y="40" fill="#94a3b8" font-size="11" text-anchor="middle">6</text>
  </g>

  <!-- Arrow -->
  <path d="M 215 65 L 255 65 M 250 60 L 255 65 L 250 70" fill="none" stroke="#64748b" stroke-width="2.5"/>

  <!-- After Merge Grid -->
  <g transform="translate(285, 40)">
    <text x="70" y="-8" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">Merged Cell (Discards Others)</text>
    <rect x="0" y="0" width="140" height="48" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="70" y="30" fill="#fff" font-weight="bold" font-size="20" text-anchor="middle">1</text>
  </g>
  <text x="240" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">Excel Alert: "Merging cells only keeps the upper-left value and discards other values."</text>
</svg>