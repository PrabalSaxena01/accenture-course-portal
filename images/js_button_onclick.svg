<svg viewBox="0 0 540 190" width="100%" height="190" xmlns="http://www.w3.org/2000/svg">
  <rect width="540" height="190" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">DOM ELEMENT ATTRIBUTE EXTRACTION: getAttribute(&apos;onclick&apos;)</text>
  
  <!-- HTML Button Element representation -->
  <g transform="translate(30, 45)">
    <rect width="480" height="50" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="20" y="30" fill="#cbd5e1" font-family="monospace" font-size="12">&lt;<tspan fill="#f43f5e">button</tspan> <tspan fill="#eab308">id</tspan>=<tspan fill="#a3e635">"myBtn"</tspan> <tspan fill="#eab308">onclick</tspan>=<tspan fill="#38bdf8">"myFunction(this);"</tspan>&gt;Click Me&lt;/<tspan fill="#f43f5e">button</tspan>&gt;</text>
  </g>

  <!-- JS Code snippet & Evaluation Result -->
  <g transform="translate(30, 110)">
    <rect width="480" height="55" rx="6" fill="#022c22" stroke="#059669" stroke-width="1.5"/>
    <text x="20" y="24" fill="#a7f3d0" font-family="monospace" font-size="11">document.getElementById('myBtn').getAttribute('onclick')</text>
    <text x="20" y="44" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">↳ Evaluates to String: "myFunction(this);"</text>
  </g>
</svg>